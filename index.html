<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locify Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
  color: white;
}

.center {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

.splash {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 3px;
  animation: fadeZoom 2s ease-in-out;
}

@keyframes fadeZoom {
  0% {opacity:0; transform:scale(0.5);}
  100% {opacity:1; transform:scale(1);}
}

.hidden { display:none; }

.topbar {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  padding: 15px;
  font-size: 16px;
}

input {
  padding: 12px;
  width: 90%;
  margin: 8px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

button {
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(45deg, #ff416c, #ff4b2b);
  color: white;
  cursor: pointer;
  margin:5px;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  margin: 15px;
  padding: 15px;
  border-radius: 20px;
  animation: slideUp 0.5s ease;
}

@keyframes slideUp {
  from {transform:translateY(20px); opacity:0;}
  to {transform:translateY(0); opacity:1;}
}

.card img {
  width:100%;
  border-radius:15px;
}

.fav {
  font-size:22px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="center splash">Locify</div>

<!-- ONBOARD -->
<div id="onboard" class="center hidden">
  <h2>Welcome to Locify</h2>
  <input id="name" placeholder="Enter your name">
  <input id="city" placeholder="Enter your city">
  <input id="state" placeholder="Enter your state">
  <button onclick="goHome()">Enter App</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">
  <div class="topbar" id="locationText">📍 Loading...</div>

  <div style="padding:10px;">
    <input id="search" placeholder="Search shops..." onkeyup="renderList()">
    <button onclick="showFavorites()">❤️ Favorites</button>
    <button onclick="loadShops()">🏠 Home</button>
    <div id="list"></div>
  </div>
</div>

<script>

let userName = "";
let userCity = "";
let userState = "";

let favorites = JSON.parse(localStorage.getItem("fav")) || [];
let shops = [];

// AUTO SPLASH
setTimeout(startApp, 3000);

function startApp(){
  document.getElementById("splash").classList.add("hidden");

  let savedUser = JSON.parse(localStorage.getItem("user"));

  if(savedUser){
    userName = savedUser.userName;
    userCity = savedUser.userCity;
    userState = savedUser.userState;

    document.getElementById("home").classList.remove("hidden");
    updateTopbar();
    loadShops();
  } else {
    document.getElementById("onboard").classList.remove("hidden");
  }
}

// GO HOME AFTER INPUT
function goHome(){
  userName = document.getElementById("name").value;
  userCity = document.getElementById("city").value;
  userState = document.getElementById("state").value;

  localStorage.setItem("user", JSON.stringify({userName, userCity, userState}));

  document.getElementById("onboard").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  updateTopbar();
  loadShops();
}

// TOPBAR UPDATE
function updateTopbar(){
  document.getElementById("locationText").innerText =
    `👋 ${userName} | 📍 ${userCity}, ${userState}`;
}

// LOAD SHOPS
function loadShops(){
  shops = [
    {id:1,name:"Fashion Hub",type:"Clothing",img:"https://images.unsplash.com/photo-1521334884684-d80222895322"},
    {id:2,name:"Shoe Palace",type:"Shoes",img:"https://images.unsplash.com/photo-1528701800489-20be3c2eaebf"},
    {id:3,name:"Food Corner",type:"Restaurant",img:"https://images.unsplash.com/photo-1504674900247-0877df9cc836"},
    {id:4,name:"Mobile World",type:"Electronics",img:"https://images.unsplash.com/photo-1510552776732-01acc1e2f5f7"}
  ];

  renderList();
}

// RENDER
function renderList(){
  let search = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");
  list.innerHTML = "";

  let filtered = shops.filter(s =>
    s.name.toLowerCase().includes(search) ||
    s.type.toLowerCase().includes(search)
  );

  filtered.forEach((item, index)=>{
    let isFav = favorites.includes(item.id);

    setTimeout(()=>{
      list.innerHTML += `
        <div class="card">
          <img src="${item.img}">
          <h3>${item.name}</h3>
          <p>${item.type}</p>

          <span class="fav" onclick="toggleFav(${item.id})">
            ${isFav ? "❤️" : "🤍"}
          </span>

          <br>
          <button onclick="openMap('${item.name}')">🗺️ Open Map</button>
        </div>
      `;
    }, index * 150);
  });
}

// MAP
function openMap(name){
  window.open(`https://www.google.com/maps/search/${name}+near+${userCity}`);
}

// FAVORITE
function toggleFav(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
  } else {
    favorites.push(id);
  }

  localStorage.setItem("fav", JSON.stringify(favorites));
  renderList();
}

// SHOW FAVORITES
function showFavorites(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  let favItems = shops.filter(s=>favorites.includes(s.id));

  favItems.forEach(item=>{
    list.innerHTML += `
      <div class="card">
        <img src="${item.img}">
        <h3>${item.name}</h3>
        <button onclick="openMap('${item.name}')">🗺️ Open Map</button>
      </div>
    `;
  });
}

</script>

</body>
</html>
