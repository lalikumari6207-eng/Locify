<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locify Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- FIREBASE (FIXED V8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
  color: white;
}

.center {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

.hidden { display:none; }

.splash {
  font-size: 40px;
  font-weight: bold;
  animation: fade 1.5s ease;
}

@keyframes fade {
  from {opacity:0; transform:scale(0.5);}
  to {opacity:1; transform:scale(1);}
}

.topbar {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  backdrop-filter: blur(10px);
}

input {
  padding: 12px;
  width: 90%;
  margin: 8px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  background: #ff4b2b;
  color: white;
  cursor: pointer;
  margin: 5px;
}

.card {
  background: rgba(255,255,255,0.1);
  margin: 15px;
  padding: 15px;
  border-radius: 15px;
}

.card img {
  width: 100%;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="center splash">Locify</div>

<!-- ONBOARD -->
<div id="onboard" class="center hidden">
  <h2>Enter Details</h2>
  <input id="name" placeholder="Name">
  <input id="city" placeholder="City">
  <input id="state" placeholder="State">
  <button onclick="goHome()">Enter</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">
  <div class="topbar" id="topbar">Loading...</div>

  <div style="padding:10px;">
    <input id="search" placeholder="Search shops..." onkeyup="renderList()">

    <button onclick="showAdd()">➕ Add Shop</button>

    <div id="list"></div>
  </div>
</div>

<!-- ADD SHOP -->
<div id="addForm" class="center hidden">
  <h2>Add Shop</h2>

  <input id="shopName" placeholder="Shop Name">
  <input id="shopType" placeholder="Type">
  <input id="shopCity" placeholder="City">
  <input id="shopPhone" placeholder="Phone">
  <input type="file" id="shopImage">

  <button onclick="saveShop()">Save Shop</button>
</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBLjvPcy9ypN_nkx2vXcTu9A4YiYMoYq2A",
  authDomain: "locify-57f73.firebaseapp.com",
  databaseURL: "https://locify-57f73-default-rtdb.firebaseio.com",
  projectId: "locify-57f73",
  storageBucket: "locify-57f73.appspot.com",
  messagingSenderId: "231657948871",
  appId: "1:231657948871:web:7bc39f030cb51b285920e2"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();

/* ================= DATA ================= */
let userName = "";
let userCity = "";
let userState = "";
let shops = [];

/* ================= SPLASH ================= */
setTimeout(() => {
  document.getElementById("splash").classList.add("hidden");

  let user = localStorage.getItem("user");

  if (user) {
    user = JSON.parse(user);

    userName = user.userName;
    userCity = user.userCity;
    userState = user.userState;

    document.getElementById("home").classList.remove("hidden");

    document.getElementById("topbar").innerText =
      `👋 ${userName} | 📍 ${userCity}, ${userState}`;

    loadShops();
  } else {
    document.getElementById("onboard").classList.remove("hidden");
  }
}, 2000);

/* ================= USER ================= */
function goHome() {
  userName = document.getElementById("name").value;
  userCity = document.getElementById("city").value;
  userState = document.getElementById("state").value;

  localStorage.setItem("user", JSON.stringify({userName,userCity,userState}));

  document.getElementById("onboard").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  document.getElementById("topbar").innerText =
    `👋 ${userName} | 📍 ${userCity}, ${userState}`;

  loadShops();
}

/* ================= ADD FORM ================= */
function showAdd() {
  document.getElementById("addForm").classList.remove("hidden");
}

/* ================= IMAGE UPLOAD ================= */
function uploadImage(file, cb) {
  let ref = storage.ref("shops/" + file.name);
  let task = ref.put(file);

  task.on("state_changed",
    null,
    (err) => console.log(err),
    () => {
      task.snapshot.ref.getDownloadURL().then(url => {
        cb(url);
      });
    }
  );
}

/* ================= SAVE SHOP ================= */
function saveShop() {

  let file = document.getElementById("shopImage").files[0];

  if (!file) {
    alert("Please select image");
    return;
  }

  uploadImage(file, (url) => {

    let shop = {
      name: shopName.value,
      type: shopType.value,
      city: shopCity.value,
      phone: shopPhone.value,
      image: url
    };

    db.ref("shops").push(shop);

    alert("Shop Added 🚀");

    document.getElementById("addForm").classList.add("hidden");

    loadShops();
  });
}

/* ================= LOAD SHOPS ================= */
function loadShops() {

  db.ref("shops").on("value", snap => {
    shops = [];

    snap.forEach(child => {
      let data = child.val();

      if (data.city && data.city.toLowerCase() === userCity.toLowerCase()) {
        shops.push(data);
      }
    });

    renderList();
  });
}

/* ================= RENDER ================= */
function renderList() {

  let search = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");

  list.innerHTML = "";

  let filtered = shops.filter(s =>
    s.name.toLowerCase().includes(search) ||
    s.type.toLowerCase().includes(search)
  );

  filtered.forEach(item => {
    list.innerHTML += `
      <div class="card">
        <img src="${item.image}">
        <h3>${item.name}</h3>
        <p>${item.type}</p>
        <p>${item.phone}</p>
      </div>
    `;
  });
}

</script>

</body>
</html>
