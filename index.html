<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locify Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<style>
body{
  margin:0;
  font-family:Poppins;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}

.hidden{display:none;}

.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

.splash{
  font-size:45px;
  font-weight:bold;
  animation:zoom 1.5s ease;
}

@keyframes zoom{
  from{opacity:0;transform:scale(0.5);}
  to{opacity:1;transform:scale(1);}
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
}

/* HERO */
.hero{
  height:160px;
  margin:10px;
  border-radius:15px;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:flex-end;
  padding:10px;
  font-weight:bold;
}

/* INPUT */
input,textarea{
  width:90%;
  padding:12px;
  margin:6px;
  border:none;
  border-radius:10px;
  outline:none;
}

/* BUTTON */
button{
  padding:10px 15px;
  border:none;
  border-radius:20px;
  background:linear-gradient(45deg,#00c6ff,#0072ff);
  color:white;
  cursor:pointer;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.1);
  margin:10px;
  padding:15px;
  border-radius:15px;
  backdrop-filter:blur(10px);
}

.card img{
  width:100%;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="center splash">LOCIFY</div>

<!-- ONBOARD -->
<div id="onboard" class="center hidden">
  <h2>Welcome 👋</h2>
  <input id="name" placeholder="Name">
  <input id="city" placeholder="City">
  <input id="state" placeholder="State">
  <button onclick="startApp()">Continue</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">

  <div class="topbar">
    <div id="userText"></div>
    <button onclick="showAdd()">➕</button>
  </div>

  <div class="hero" id="hero">Loading...</div>

  <div style="padding:10px;">
    <input id="search" placeholder="Search shops..." onkeyup="render()">
    <div id="list"></div>
  </div>
</div>

<!-- ADD SHOP -->
<div id="addForm" class="center hidden">

  <h2>Add Shop 🏪</h2>

  <input id="shopName" placeholder="Shop Name">
  <input id="shopType" placeholder="Type">
  <input id="shopItem" placeholder="Item">
  <input id="shopLocation" placeholder="Location">
  <input id="shopContact" placeholder="Contact">
  <textarea id="shopMsg" placeholder="Description"></textarea>

  <input type="file" id="shopImage">

  <button onclick="saveShop()">Upload Shop</button>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBLjvPcy9ypN_nkx2vXcTu9A4YiYMoYq2A",
  authDomain: "locify-57f73.firebaseapp.com",
  databaseURL: "https://locify-57f73-default-rtdb.firebaseio.com",
  projectId: "locify-57f73",
  storageBucket: "locify-57f73.appspot.com"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();

/* DATA */
let userName="", userCity="", userState="";

/* SPLASH */
setTimeout(()=>{

  document.getElementById("splash").classList.add("hidden");

  let user = JSON.parse(localStorage.getItem("user"));

  if(!user){
    document.getElementById("onboard").classList.remove("hidden");
  } else {
    startHome(user);
  }

},2000);

/* START */
function startApp(){

  let user = {
    name: name.value,
    city: city.value,
    state: state.value
  };

  localStorage.setItem("user", JSON.stringify(user));
  startHome(user);
}

/* HOME */
function startHome(user){

  userName = user.name;
  userCity = user.city;
  userState = user.state;

  document.getElementById("onboard").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  document.getElementById("userText").innerText =
    `👤 ${userName} | 📍 ${userCity}, ${userState}`;

  document.getElementById("hero").style.backgroundImage =
    `url('https://source.unsplash.com/1600x900/?${userCity},india,city')`;

  document.getElementById("hero").innerText =
    `Welcome to ${userCity} ❤️`;

  loadShops();
}

/* ADD */
function showAdd(){
  document.getElementById("addForm").classList.remove("hidden");
}

/* UPLOAD IMAGE */
function uploadImage(file, cb){
  let ref = storage.ref("shops/" + Date.now() + "_" + file.name);

  ref.put(file).then(snap=>{
    snap.ref.getDownloadURL().then(cb);
  });
}

/* SAVE SHOP */
function saveShop(){

  let file = shopImage.files[0];
  if(!file){
    alert("Select image");
    return;
  }

  uploadImage(file,(url)=>{

    let shop = {
      name: shopName.value,
      type: shopType.value,
      item: shopItem.value,
      location: shopLocation.value,
      contact: shopContact.value,
      msg: shopMsg.value,
      city: userCity,
      image: url
    };

    db.ref("shops").push(shop);

    alert("Shop Added 🚀");

    document.getElementById("addForm").classList.add("hidden");

    loadShops();
  });
}

/* LOAD */
function loadShops(){

  db.ref("shops").on("value",snap=>{

    let shops = [];

    snap.forEach(s=>{
      let d = s.val();
      if(d.city && d.city.toLowerCase() === userCity.toLowerCase()){
        shops.push(d);
      }
    });

    render(shops);
  });
}

/* RENDER */
function render(shops=[]){

  let q = search.value ? search.value.toLowerCase() : "";
  let list = document.getElementById("list");

  let filtered = shops.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.type.toLowerCase().includes(q)
  );

  if(filtered.length===0){
    list.innerHTML = `
      <div class="card">
        <h3>No Shops Yet 📍</h3>
        <p>Be first to add shop in ${userCity}</p>
      </div>
    `;
    return;
  }

  list.innerHTML="";

  filtered.forEach(s=>{
    list.innerHTML+=`
      <div class="card">
        <img src="${s.image}">
        <h3>${s.name}</h3>
        <p>${s.type}</p>
        <p>${s.item}</p>
        <p>${s.location}</p>
        <p>${s.contact}</p>
        <p>${s.msg}</p>
      </div>
    `;
  });
}

</script>

</body>
</html>
