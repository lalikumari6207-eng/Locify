<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locify</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b,#0b1220);
  color:white;
}

#onboard,#home{display:none;}

.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

input,textarea{
  width:90%;
  padding:12px;
  margin:6px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#111827;
  color:white;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#3b82f6,#8b5cf6);
  color:white;
  cursor:pointer;
  margin:5px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:rgba(17,24,39,0.7);
}

.hero{
  height:140px;
  margin:10px;
  border-radius:15px;
  background-size:cover;
  display:flex;
  align-items:flex-end;
  padding:10px;
}

.feed{flex:1;overflow:auto;padding:10px;}

.card{
  background:rgba(30,41,59,0.8);
  margin:10px 0;
  padding:10px;
  border-radius:15px;
}

.card img{width:100%;border-radius:12px;}

.modal{
  position:fixed;
  inset:0;
  background:#000a;
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#111827;
  padding:15px;
  width:90%;
  border-radius:15px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="center">
  <h1>LOCIFY</h1>
</div>

<!-- ONBOARD -->
<div id="onboard" class="center">
  <h2>Welcome 🚀</h2>
  <input id="name" placeholder="Name">
  <input id="city" placeholder="City">
  <input id="state" placeholder="State">
  <button onclick="startApp()">Continue</button>
</div>

<!-- HOME -->
<div id="home">

  <div class="topbar">
    <button onclick="openModal()">+ Add Shop</button>
    <div id="userInfo"></div>
  </div>

  <div class="hero" id="hero">Loading...</div>

  <div class="feed">
    <input id="search" placeholder="Search..." onkeyup="render()">
    <div id="list"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">

    <h3>Add Shop</h3>

    <input id="shopName" placeholder="Shop Name">
    <input id="shopType" placeholder="Type">
    <input id="shopItem" placeholder="Item">
    <input id="shopLocation" placeholder="Location">
    <input id="shopContact" placeholder="Contact">
    <textarea id="shopMsg" placeholder="Description"></textarea>
    <input type="file" id="shopImage">

    <button onclick="saveShop()">Upload</button>
    <button onclick="closeModal()">Close</button>

  </div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBLjvPcy9ypN_nkx2vXcTu9A4YiYMoY2A",
  authDomain: "locify-57f73.firebaseapp.com",
  databaseURL: "https://locify-57f73-default-rtdb.firebaseio.com",
  projectId: "locify-57f73",
  storageBucket: "locify-57f73.appspot.com",
  messagingSenderId: "231657948871",
  appId: "1:231657948871:web:7bc39f030cb51b285920e2"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();

let user = null;
let shops = [];

/* SPLASH SAFE FIX */
setTimeout(() => {
  document.getElementById("splash").style.display = "none";

  const data = localStorage.getItem("user");

  if (data) {
    try {
      user = JSON.parse(data);

      if (!user?.name || !user?.city) {
        throw "invalid";
      }

      openHome();
    } catch (e) {
      localStorage.removeItem("user");
      document.getElementById("onboard").style.display = "flex";
    }

  } else {
    document.getElementById("onboard").style.display = "flex";
  }

}, 1500);

/* START FIX */
function startApp() {
  const name = document.getElementById("name").value.trim();
  const city = document.getElementById("city").value.trim();
  const state = document.getElementById("state").value.trim();

  if (!name || !city || !state) {
    alert("Fill all fields");
    return;
  }

  user = { name, city, state };
  localStorage.setItem("user", JSON.stringify(user));
  openHome();
}

/* HOME FIX */
function openHome() {
  document.getElementById("onboard").style.display = "none";
  document.getElementById("home").style.display = "block";

  document.getElementById("userInfo").innerText =
    `${user?.name || ""} | ${user?.city || ""}`;

  document.getElementById("hero").style.backgroundImage =
    `url('https://source.unsplash.com/1600x900/?${user.city},city')`;

  loadShops();
}

/* MODAL */
function openModal(){
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* IMAGE UPLOAD SAFE */
function uploadImage(file, cb){
  if(!file){
    alert("Select image first");
    return;
  }

  const ref = storage.ref("shops/" + Date.now() + "_" + file.name);

  ref.put(file).then(snapshot=>{
    snapshot.ref.getDownloadURL().then(cb);
  }).catch(err=>{
    alert("Upload failed");
  });
}

/* SAVE SHOP FIX */
function saveShop(){

  const file = document.getElementById("shopImage").files[0];

  if(!file){
    alert("Select image first");
    return;
  }

  uploadImage(file,(url)=>{

    const shop = {
      name: document.getElementById("shopName").value.trim(),
      type: document.getElementById("shopType").value.trim(),
      item: document.getElementById("shopItem").value.trim(),
      location: document.getElementById("shopLocation").value.trim(),
      contact: document.getElementById("shopContact").value.trim(),
      msg: document.getElementById("shopMsg").value.trim(),
      city: user.city.toLowerCase(),
      image: url
    };

    db.ref("shops").push(shop);

    alert("Shop Added 🚀");
    closeModal();
  });
}

/* LOAD */
function loadShops(){
  db.ref("shops").on("value", snap=>{
    shops = [];

    snap.forEach(s=>{
      const d = s.val();
      if(d?.city === user.city.toLowerCase()){
        shops.push(d);
      }
    });

    render();
  });
}

/* RENDER SAFE */
function render(){

  const q = (document.getElementById("search").value || "").toLowerCase();
  const list = document.getElementById("list");

  list.innerHTML = "";

  const filtered = shops.filter(s =>
    (s?.name || "").toLowerCase().includes(q) ||
    (s?.type || "").toLowerCase().includes(q)
  );

  if(filtered.length === 0){
    list.innerHTML = "<div class='card'>No Shops Found</div>";
    return;
  }

  filtered.forEach(s=>{
    list.innerHTML += `
      <div class="card">
        <img src="${s.image}">
        <h3>${s.name}</h3>
        <p>${s.type}</p>
        <p>${s.item}</p>
        <p>${s.location}</p>
        <p>${s.contact}</p>
        <p>${s.msg}</p>
      </div>
    `;
  });
}

</script>

</body>
</html>
