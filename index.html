<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locify App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<style>
body{
  margin:0;
  font-family:Poppins;
  background:#0f172a;
  color:white;
  overflow:hidden;
}

.hidden{display:none;}

.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

.splash{
  font-size:42px;
  font-weight:bold;
}

/* SCREEN */
.screen{
  display:none;
  height:100vh;
  flex-direction:column;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:rgba(255,255,255,0.08);
}

/* HERO */
.hero{
  height:120px;
  margin:10px;
  border-radius:15px;
  background-size:cover;
  display:flex;
  align-items:flex-end;
  padding:10px;
}

/* FEED */
.feed{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.card img{
  width:100%;
  border-radius:10px;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#111827;
  padding:15px;
  border-radius:12px;
  width:90%;
}

input,textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#3b82f6;
  color:white;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="center splash">LOCIFY</div>

<!-- ONBOARD -->
<div id="onboard" class="screen center">
  <div>
    <h2>Welcome 👋</h2>
    <input id="name" placeholder="Name">
    <input id="city" placeholder="City">
    <input id="state" placeholder="State">
    <button onclick="startApp()">Continue</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">

  <div class="topbar">
    <button onclick="openModal()">➕ Add Shop</button>
    <div id="userInfo"></div>
  </div>

  <div class="hero" id="hero">Loading...</div>

  <div class="feed">
    <input id="search" placeholder="Search shops..." onkeyup="render()">
    <div id="list"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">

    <h3>Add Shop 🏪</h3>

    <input id="shopName" placeholder="Shop Name">
    <input id="shopType" placeholder="Type">
    <input id="shopItem" placeholder="Item">
    <input id="shopLocation" placeholder="Location">
    <input id="shopContact" placeholder="Contact">
    <textarea id="shopMsg" placeholder="Message"></textarea>
    <input type="file" id="shopImage">

    <button onclick="saveShop()">Upload</button>
    <button onclick="closeModal()">Close</button>

  </div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBLjvPcy9ypN_nkx2vXcTu9A4YiYMoYq2A",
  authDomain: "locify-57f73.firebaseapp.com",
  databaseURL: "https://locify-57f73-default-rtdb.firebaseio.com",
  projectId: "locify-57f73",
  storageBucket: "locify-57f73.appspot.com"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();

let user = null;
let shops = [];

/* SPLASH */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";

  let data = localStorage.getItem("user");

  if(!data){
    document.getElementById("onboard").style.display="flex";
  } else {
    user = JSON.parse(data);
    openHome();
  }
},2000);

/* START */
function startApp(){

  user = {
    name:name.value,
    city:city.value,
    state:state.value
  };

  localStorage.setItem("user",JSON.stringify(user));

  openHome();
}

/* HOME */
function openHome(){

  document.getElementById("onboard").style.display="none";
  document.getElementById("home").style.display="flex";

  document.getElementById("userInfo").innerText =
    `👤 ${user.name} | 📍 ${user.city}`;

  document.getElementById("hero").style.backgroundImage =
    `url('https://source.unsplash.com/1600x900/?${user.city},india,city')`;

  loadShops();
}

/* MODAL */
function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* IMAGE UPLOAD */
function uploadImage(file, cb){

  let ref = storage.ref("shops/" + Date.now() + "_" + file.name);

  ref.put(file).then(snap=>{
    snap.ref.getDownloadURL().then(cb);
  });
}

/* SAVE SHOP */
function saveShop(){

  let file = shopImage.files[0];
  if(!file) return alert("Select image");

  uploadImage(file,(url)=>{

    let shop = {
      name:shopName.value,
      type:shopType.value,
      item:shopItem.value,
      location:shopLocation.value,
      contact:shopContact.value,
      msg:shopMsg.value,
      city:user.city,
      image:url
    };

    db.ref("shops").push(shop);

    alert("Shop Added 🚀");

    closeModal();
  });
}

/* LOAD */
function loadShops(){

  db.ref("shops").on("value",snap=>{

    shops = [];

    snap.forEach(s=>{
      let d = s.val();
      if(d.city && d.city.toLowerCase() === user.city.toLowerCase()){
        shops.push(d);
      }
    });

    render();
  });
}

/* RENDER */
function render(){

  let q = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");

  let filtered = shops.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.type.toLowerCase().includes(q)
  );

  if(filtered.length === 0){
    list.innerHTML = `
      <div class="card">
        <h3>No Shops Found 📍</h3>
        <p>Add your first shop in ${user.city}</p>
      </div>
    `;
    return;
  }

  list.innerHTML = "";

  filtered.forEach(s=>{
    list.innerHTML += `
      <div class="card">
        <img src="${s.image}">
        <h3>${s.name}</h3>
        <p>${s.type}</p>
        <p>${s.item}</p>
        <p>${s.location}</p>
        <p>${s.contact}</p>
        <p>${s.msg}</p>
      </div>
    `;
  });
}

</script>

</body>
</html>
