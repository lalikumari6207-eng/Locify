<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locify Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

body{
  margin:0;
  font-family:Poppins;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}

/* SPLASH */
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

.splash{
  font-size:45px;
  font-weight:bold;
  color:white;
  animation: zoom 1.5s ease;
}

@keyframes zoom{
  from{opacity:0; transform:scale(0.5);}
  to{opacity:1; transform:scale(1);}
}

.hidden{display:none;}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
}

/* INPUT */
input, textarea{
  width:90%;
  padding:12px;
  margin:6px;
  border:none;
  border-radius:10px;
  outline:none;
}

/* BUTTON */
button{
  padding:10px 15px;
  border:none;
  border-radius:20px;
  background:linear-gradient(45deg,#00c6ff,#0072ff);
  color:white;
  cursor:pointer;
  margin:5px;
}

button:hover{
  transform:scale(1.05);
}

/* CARD */
.card{
  background:rgba(255,255,255,0.1);
  padding:15px;
  margin:10px;
  border-radius:15px;
  backdrop-filter:blur(10px);
}

.card img{
  width:100%;
  border-radius:10px;
}

/* BACKGROUND HERO */
.hero{
  height:150px;
  background:url("https://images.unsplash.com/photo-1508057198894-247b23fe5ade");
  background-size:cover;
  border-radius:15px;
  margin:10px;
  display:flex;
  align-items:flex-end;
  padding:10px;
  font-weight:bold;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="center splash">Locify</div>

<!-- ONBOARD -->
<div id="onboard" class="center hidden">
  <h2>Welcome 👋</h2>
  <input id="name" placeholder="Enter your name">
  <input id="city" placeholder="Enter city">
  <input id="state" placeholder="Enter state">
  <button onclick="startApp()">Continue</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">

  <div class="topbar">
    <div id="userText"></div>
    <button onclick="showAdd()">➕</button>
  </div>

  <div class="hero" id="heroText">Discover your city</div>

  <div style="padding:10px;">
    <input id="search" placeholder="Search shops..." onkeyup="render()">

    <div id="list"></div>
  </div>

</div>

<!-- ADD SHOP -->
<div id="addForm" class="center hidden">

  <h2>Add Shop 🏪</h2>

  <input id="shopName" placeholder="Shop Name">
  <input id="shopType" placeholder="Shop Type">
  <input id="shopItem" placeholder="What they sell">
  <input id="shopLocation" placeholder="Location">
  <input id="shopContact" placeholder="Contact">
  <textarea id="shopMsg" placeholder="Description"></textarea>

  <input type="file" id="shopImage">

  <button onclick="saveShop()">Upload Shop</button>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBLjvPcy9ypN_nkx2vXcTu9A4YiYMoYq2A",
  authDomain: "locify-57f73.firebaseapp.com",
  databaseURL: "https://locify-57f73-default-rtdb.firebaseio.com",
  projectId: "locify-57f73"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
  function uploadImage(file, callback){

  let storageRef = storage.ref("shops/" + Date.now() + "_" + file.name);

  let uploadTask = storageRef.put(file);

  uploadTask.on("state_changed",

    null,
    (error)=> console.log(error),

    ()=> {
      uploadTask.snapshot.ref.getDownloadURL().then(url=>{
        callback(url);
      });
    }

  );
  }

/* DATA */
let userName="", userCity="", userState="";
let shops=[];

/* SPLASH */
setTimeout(()=>{
  document.getElementById("splash").classList.add("hidden");

  let user = localStorage.getItem("user");

  if(!user){
    document.getElementById("onboard").classList.remove("hidden");
  }else{
    user = JSON.parse(user);
    userName=user.userName;
    userCity=user.userCity;
    userState=user.userState;
    openHome();
  }

},2000);

/* START */
function startApp(){

  userName=document.getElementById("name").value;
  userCity=document.getElementById("city").value;
  userState=document.getElementById("state").value;

  localStorage.setItem("user",JSON.stringify({userName,userCity,userState}));

  openHome();
}

/* HOME */
function openHome(){
  document.getElementById("onboard").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  document.getElementById("userText").innerHTML =
    `👤 ${userName} | 📍 ${userCity}`;

  document.getElementById("heroText").innerText =
    "Welcome to " + userCity + " ❤️";

  loadShops();
}

/* ADD FORM */
function showAdd(){
  document.getElementById("addForm").classList.remove("hidden");
}

/* SAVE SHOP */
  function saveShop(){

  let file = document.getElementById("shopImage").files[0];

  if(!file){
    alert("Please select shop image");
    return;
  }

  uploadImage(file, (imageUrl)=>{

    let shop = {
      name: shopName.value,
      type: shopType.value,
      item: shopItem.value,
      location: shopLocation.value,
      contact: shopContact.value,
      msg: shopMsg.value,
      city: userCity,
      image: imageUrl
    };

  db.ref("shops").push(shop);

  alert("Shop Added 🚀");

  document.getElementById("addForm").classList.add("hidden");
}

/* LOAD */
function loadShops(){

  db.ref("shops").on("value",snap=>{
    shops=[];

    snap.forEach(s=>{
      let d=s.val();
      if(d.city==userCity){
        shops.push(d);
      }
    });

    render();
  });

}

/* RENDER */
    function render(){

  let q = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");

  let filtered = shops.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.type.toLowerCase().includes(q)
  );

  if(filtered.length === 0){
    list.innerHTML = `
      <div class="card">
        <h3>No shops found 📍</h3>
        <p>Add first shop in ${userCity}</p>
      </div>
    `;
    return;
  }

  list.innerHTML = "";

  filtered.forEach(s => {
    list.innerHTML += `
      <div class="card">

        <img src="${s.image}" style="width:100%;border-radius:12px;margin-bottom:10px;">

        <h3>${s.name}</h3>
        <p>🏷️ ${s.type}</p>
        <p>🛍️ ${s.item}</p>
        <p>📍 ${s.location}</p>
        <p>📞 ${s.contact}</p>
        <p>${s.msg}</p>

      </div>
    `;
  });

    }
    `;
    return;
  }

  list.innerHTML="";

  filtered.forEach(s=>{
    list.innerHTML+=`
      <div class="card">
        <h3>${s.name}</h3>
        <p>🏷️ ${s.type}</p>
        <p>🛍️ ${s.item}</p>
        <p>📍 ${s.location}</p>
        <p>📞 ${s.contact}</p>
        <p>${s.msg}</p>
      </div>
    `;
  });

}

</script>

</body>
</html>
